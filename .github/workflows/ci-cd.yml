name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: vitalwatch

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest suite
        run: pytest -v

  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub secrets
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets not set — image will be built but not pushed"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.check.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.check.outputs.push == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:v1
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=VitalWatch
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vitalwatch-ci
      - name: Build image and load into cluster
        run: |
          docker build -t shakthe/vitalwatch:v1 .
          kind load docker-image shakthe/vitalwatch:v1 --name vitalwatch-ci
      - name: Apply manifests
        run: kubectl apply -f k8s/
      - name: Wait for rollout
        run: kubectl rollout status deployment/vitalwatch -n vitalwatch --timeout=180s
      - name: Verify deployment
        run: |
          kubectl get all -n vitalwatch
          kubectl run smoke --rm -i --restart=Never -n vitalwatch --image=curlimages/curl -- \
            curl -sf http://vitalwatch.vitalwatch.svc.cluster.local/health
