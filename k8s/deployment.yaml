apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalwatch
  namespace: vitalwatch
  labels:
    app: vitalwatch
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: vitalwatch
  template:
    metadata:
      labels:
        app: vitalwatch
    spec:
      containers:
        - name: vitalwatch
          image: shakthe/vitalwatch:v1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: vitalwatch-config
            - secretRef:
                name: vitalwatch-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
