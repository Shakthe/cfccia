apiVersion: v1
kind: Service
metadata:
  name: vitalwatch
  namespace: vitalwatch
spec:
  # NodePort for local clusters — a one-line change to LoadBalancer on EKS
  type: NodePort
  selector:
    app: vitalwatch
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitalwatch
  namespace: vitalwatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vitalwatch
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
