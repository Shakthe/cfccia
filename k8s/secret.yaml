apiVersion: v1
kind: Secret
metadata:
  name: vitalwatch-secrets
  namespace: vitalwatch
type: Opaque
stringData:
  # AWS IoT Core endpoint for real wearable push delivery.
  # Left empty here: the app then simulates the MQTT publish and logs it.
  AWS_IOT_ENDPOINT: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
